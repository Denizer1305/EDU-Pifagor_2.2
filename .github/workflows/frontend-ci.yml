name: Frontend CI

on:
  push:
    branches:
      - main
      - dev
      - dev-frontend
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
      - ".editorconfig"
      - ".gitignore"

  pull_request:
    branches:
      - main
      - dev
      - dev-frontend
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
      - ".editorconfig"
      - ".gitignore"
      - "docker-compose.dev.yml"
      - "docker-compose.yml"
      - "deploy/**"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    env:
      NODE_ENV: test
      VITE_API_BASE_URL: http://localhost:8000/api/v1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Show versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high

      - name: Run lint if available
        run: |
          node -e "const pkg=require('./package.json'); process.exit(pkg.scripts && pkg.scripts.lint ? 0 : 1)" \
            && npm run lint \
            || echo "Lint script is not configured yet. Skipping."

      - name: Run tests if available
        run: |
          node -e "const pkg=require('./package.json'); process.exit(pkg.scripts && pkg.scripts.test ? 0 : 1)" \
            && npm run test \
            || echo "Test script is not configured yet. Skipping."

      - name: Build frontend
        run: npm run build
